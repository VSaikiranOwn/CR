[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cr-tool"
version = "2.0.0"
description = "Generate the CR Estimation Framework (ver. 2) workbook from a reviewed JSON spec"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=7"]

[project.scripts]
cr-tool = "cr_tool.cli:main"
cr-estimate = "cr_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
